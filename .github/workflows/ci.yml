name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck (Next app scope)
        run: bunx tsc --noEmit

      - name: Backend syntax gate
        run: bun build --no-bundle mini-services/safebus-backend/index.ts --outdir /tmp/sb-check --target bun > /dev/null
